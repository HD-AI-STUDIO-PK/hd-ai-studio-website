<!DOCTYPE html>
<html dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HD AI STUDIO - Veo 3</title>
<style>body{margin:0;background:#0a0a0f;color:#fff;font-family:sans-serif}.h{background:linear-gradient(90deg,#6a5af9,#f857a6);padding:18px;text-align:center}.c{max-width:500px;margin:auto;padding:15px}input,textarea{width:100%;background:#1a1a25;border:2px solid #6a5af9;border-radius:12px;color:#fff;padding:12px;margin:8px 0;box-sizing:border-box}.up{border:2px dashed #6a5af9;background:#1a1a25;border-radius:12px;padding:15px;text-align:center;margin:10px 0}.up input{display:none}.btn{width:100%;background:linear-gradient(90deg,#6a5af9,#f857a6);border:none;color:#fff;padding:16px;border-radius:25px;font-size:18px;font-weight:bold;cursor:pointer}video{width:100%;border-radius:12px;margin-top:12px}#log{background:#111;padding:10px;border-radius:8px;font-size:12px;white-space:pre-wrap;margin-top:10px;display:none}</style></head><body><div class="h"><h2>HD AI STUDIO PK - Google Veo 3.1</h2></div><div class="c">
<input id="key" type="password" placeholder="🔑 FAL_KEY یہاں پیسٹ کریں (fal.ai سے)">
<textarea id="prompt" placeholder="کہانی لکھیں... مثال: ایک آدمی باغ میں چل رہا ہے اور کہہ رہا ہے اسلام علیکم دوستو"></textarea>
<div class="up" onclick="document.getElementById('f').click()"><div id="tx">📁 تصویر اپلوڈ کریں (Veo کے لیے)</div><input type="file" id="f" accept="image/*"><img id="prev" style="width:100px;border-radius:8px;display:none;margin-top:8px"></div>
<button class="btn" onclick="generate()">🎬 اصلی Veo 3 ویڈیو بنائیں</button>
<div id="log"></div>
<video id="vid" controls style="display:none"></video>
<a id="dl" download="veo3-video.mp4" style="display:none;background:#25D366;color:#fff;padding:10px 15px;border-radius:20px;text-decoration:none;margin-top:10px;display:none;text-align:center">⬇️ ڈاؤن لوڈ کریں</a>
</div><script>let imgUrl="";document.getElementById('f').addEventListener('change',e=>{let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=ev=>{document.getElementById('prev').src=ev.target.result;document.getElementById('prev').style.display='block';imgUrl=ev.target.result;document.getElementById('tx').innerText='✅ تصویر لگ گئی'};r.readAsDataURL(file)});async function generate(){let key=document.getElementById('key').value.trim();let prompt=document.getElementById('prompt').value.trim();let log=document.getElementById('log');if(!key){alert('پہلے FAL_KEY ڈالیں');return}if(!prompt){alert('کہانی لکھیں');return}log.style.display='block';log.innerText='⏳ Veo 3.1 پر بھیج رہا ہوں... 1 منٹ لگے گا...';try{let body={prompt:prompt,duration:"8s",aspect_ratio:"9:16",resolution:"720p",generate_audio:true};if(imgUrl){body.image_url=imgUrl}let res=await fetch('https://fal.run/fal-ai/veo3.1/image-to-video',{method:'POST',headers:{'Authorization':'Key '+key,'Content-Type':'application/json'},body:JSON.stringify(body)});let data=await res.json();if(!res.ok)throw new Error(JSON.stringify(data));let video=data.video?.url||data.video_url||data.url;if(video){let v=document.getElementById('vid');v.src=video;v.style.display='block';document.getElementById('dl').href=video;document.getElementById('dl').style.display='block';log.innerText='🎉 ویڈیو تیار ہے! نیچے دیکھیں'}else{log.innerText='Response: '+JSON.stringify(data,null,2)}}catch(e){log.innerText='❌ Error: '+e.message+'\n\nنوٹ: اگر CORS error آئے تو Vercel پر Environment Variable میں FAL_KEY لگانا پڑے گا'}};</script></body></html>
