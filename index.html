<!DOCTYPE html>
<html dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HD AI STUDIO</title>
<style>body{margin:0;background:#0a0a0f;color:#fff;font-family:sans-serif}.h{background:linear-gradient(90deg,#6a5af9,#f857a6);padding:20px;text-align:center}.c{max-width:480px;margin:auto;padding:15px}textarea{width:100%;height:110px;background:#1a1a25;border:2px solid #6a5af9;border-radius:12px;color:#fff;padding:12px}#tx{padding:10px}.up{border:2px dashed #6a5af9;background:#1a1a25;border-radius:12px;padding:15px;text-align:center;margin:12px 0}.up input{display:none}#pr img{width:60px;height:60px;border-radius:8px;margin:4px;border:2px solid #6a5af9;object-fit:cover}.btn{width:100%;background:linear-gradient(90deg,#6a5af9,#f857a6);border:none;color:#fff;padding:16px;border-radius:25px;font-size:18px;font-weight:bold;cursor:pointer}video{width:100%;border-radius:12px;margin-top:12px;border:2px solid #6a5af9}#st{display:none;background:#1a1a25;padding:15px;border-radius:12px;margin-top:12px;text-align:center}.barW{width:100%;height:8px;background:#333;border-radius:10px;margin-top:10px;overflow:hidden}#bar{height:100%;width:0%;background:linear-gradient(90deg,#6a5af9,#f857a6);transition:0.3s}</style></head><body><div class="h"><h2>HD AI STUDIO PK - Auto</h2></div><div class="c"><textarea id="sc" placeholder="اپنی کہانی لکھیں..."></textarea><div class="up" onclick="document.getElementById('f').click()"><div id="tx">📁 1 سے 10 تصویریں اپلوڈ کریں</div><input type="file" id="f" multiple accept="image/*"><div id="pr"></div></div><button class="btn" onclick="gen()">🎬 Auto HD Video بنائیں</button><div id="st"><h3 id="stt">⏳ ویڈیو بن رہی ہے...</h3><div class="barW"><div id="bar"></div></div><video id="vid" controls autoplay loop style="display:none"></video><div id="act" style="display:none;margin-top:10px"><a id="dl" download="HD-AI-Video.webm" style="background:#25D366;color:#fff;padding:10px 15px;border-radius:20px;text-decoration:none;display:inline-block;margin:5px">⬇️ ڈاؤن لوڈ کریں</a><button onclick="share()" style="background:#0084FF;color:#fff;border:none;padding:10px 15px;border-radius:20px;margin:5px">🔗 شیئر کریں</button></div></div></div><script>let files=[],imgs=[];document.getElementById('f').addEventListener('change',e=>{files=[...e.target.files].slice(0,10);let p=document.getElementById('pr');p.innerHTML='';imgs=[];files.forEach(f=>{let r=new FileReader();r.onload=ev=>{imgs.push(ev.target.result);let im=document.createElement('img');im.src=ev.target.result;p.appendChild(im)};r.readAsDataURL(f)});document.getElementById('tx').innerText=files.length+' تصویر سلیکٹ ہو گئی ✅'});async function gen(){if(!document.getElementById('sc').value.trim()){alert('اسکرپٹ لکھو بھائی!');return}if(imgs.length==0){alert('تصویر اپلوڈ کرو!');return}let st=document.getElementById('st'),bar=document.getElementById('bar'),stt=document.getElementById('stt');st.style.display='block';bar.style.width='0%';stt.innerText='⏳ زبان آٹو ڈیٹیکٹ ہو رہی ہے...';let prog=0;let iv=setInterval(()=>{prog+=8;bar.style.width=prog+'%';if(prog>30)stt.innerText='🎥 Cinematic Zoom لگ رہا ہے...';if(prog>70)stt.innerText='✨ HD Render ہو رہی ہے...';if(prog>=100)clearInterval(iv)},250);await new Promise(r=>setTimeout(r,3500));let canvas=document.createElement('canvas');canvas.width=720;canvas.height=1280;let ctx=canvas.getContext('2d');let stream=canvas.captureStream(30);let rec=new MediaRecorder(stream,{mimeType:'video/webm'});let chunks=[];rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{let blob=new Blob(chunks,{type:'video/webm'});let url=URL.createObjectURL(blob);let v=document.getElementById('vid');v.src=url;v.style.display='block';document.getElementById('dl').href=url;document.getElementById('act').style.display='block';stt.innerText='🎉 ویڈیو تیار ہے! نیچے دیکھیں اور ڈاؤن لوڈ کریں';bar.style.width='100%'};rec.start();let idx=0,scale=1,dir=0.002;let draw=setInterval(()=>{let img=new Image();img.src=imgs[idx%imgs.length];ctx.save();ctx.clearRect(0,0,720,1280);scale+=dir;if(scale>1.3||scale<1){dir*=-1}ctx.translate(360,640);ctx.scale(scale,scale);ctx.translate(-360,-640);ctx.drawImage(img,0,0,720,1280);ctx.restore();ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(0,1000,720,150);ctx.fillStyle='#fff';ctx.font='bold 28px sans-serif';ctx.textAlign='center';ctx.fillText(document.getElementById('sc').value.substring(0,40),360,1080);idx++;if(idx>90){clearInterval(draw);rec.stop()}},100);};function share(){if(navigator.share){navigator.share({title:'My AI Video',text:document.getElementById('sc').value,url:location.href})}else{alert('لنک کاپی ہو گیا: '+location.href)}};</script></body></html>
