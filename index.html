<!DOCTYPE html>
<html dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HD AI STUDIO</title>
<style>body{margin:0;background:#0a0a0f;color:#fff;font-family:sans-serif}.h{background:linear-gradient(90deg,#6a5af9,#f857a6);padding:20px;text-align:center}.c{max-width:480px;margin:auto;padding:15px}textarea{width:100%;height:120px;background:#1a1a25;border:2px solid #6a5af9;border-radius:12px;color:#fff;padding:12px}.up{border:2px dashed #6a5af9;background:#1a1a25;border-radius:12px;padding:15px;text-align:center;margin:12px 0}.up input{display:none}#pr img{width:55px;height:55px;border-radius:8px;margin:4px;border:2px solid #6a5af9}.btn{width:100%;background:linear-gradient(90deg,#6a5af9,#f857a6);border:none;color:#fff;padding:16px;border-radius:25px;font-size:18px;font-weight:bold}#st{display:none;background:#1a1a25;padding:15px;border-radius:12px;margin-top:12px;text-align:center}.barW{width:100%;height:8px;background:#333;border-radius:10px;margin-top:10px;overflow:hidden}#bar{height:100%;width:0%;background:linear-gradient(90deg,#6a5af9,#f857a6)}</style></head><body><div class="h"><h2>HD AI STUDIO PK - Auto</h2></div><div class="c"><textarea id="sc" placeholder="اپنی کہانی یہاں لکھیں..."></textarea><div class="up" onclick="document.getElementById('f').click()"><div id="tx">📁 تصویر اپلوڈ کریں - یہاں کلک کریں</div><input type="file" id="f" multiple accept="image/*"><div id="pr"></div></div><button class="btn" onclick="gen()">🎬 Auto HD Video بنائیں</button><div id="st"><h3>⏳ ویڈیو بن رہی ہے...</h3><p id="stt">زبان آٹو ڈیٹیکٹ ہو رہی ہے</p><div class="barW"><div id="bar"></div></div></div></div><script>let files=[];document.getElementById('f').addEventListener('change',e=>{files=[...e.target.files].slice(0,10);let p=document.getElementById('pr');p.innerHTML='';files.forEach(f=>{let r=new FileReader();r.onload=ev=>{let i=document.createElement('img');i.src=ev.target.result;p.appendChild(i)};r.readAsDataURL(f)});document.getElementById('tx').innerText=files.length+' تصویر سلیکٹ ہو گئی ✅'});function gen(){if(!document.getElementById('sc').value.trim()){alert('اسکرپٹ لکھو!');return}if(files.length==0){alert('تصویر اپلوڈ کرو!');return}document.getElementById('st').style.display='block';let b=document.getElementById('bar'),t=document.getElementById('stt'),p=0;let iv=setInterval(()=>{p+=10;b.style.width=p+'%';if(p>30)t.innerText='Cinematic Camera لگ رہا ہے ✅';if(p>60)t.innerText='HD Render ہو رہی ہے...';if(p>=100){clearInterval(iv);t.innerText='🎉 ویڈیو تیار ہے! لنک کاپی کریں اور شیئر کریں'}},400)}</script></body></html>
